server {
    listen 8080;
    server_name localhost;

    # 安全头
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 上传体积限制
    client_max_body_size 20m;

    # 根目录指向构建好的静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 产出带 hash，不可变）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（SPA 入口需始终获取最新）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback：前端路由（vue-router history 模式）回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理：同源 /api 转发到后端（backend 为 compose 服务名）
    # 注意：proxy_pass 不带尾路径，保留完整原始 URI（/api/xxx 原样透传）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
    }
}
