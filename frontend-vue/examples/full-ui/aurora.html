var footer = document.getElementById('log-footer')
var handle = document.getElementById('log-handle')
var toggle = document.getElementById('log-toggle')
var dragging = false
if (state.logCollapsed){ footer.classList.add('collapsed'); toggle.textContent = '▲'; toggle.setAttribute('aria-expanded', 'false') }
toggle.addEventListener('click', function(){
  var collapsed = footer.classList.toggle('collapsed')
  state.logCollapsed = collapsed
  schedulePersist()
  toggle.textContent = collapsed ? '▲' : '▼'
  toggle.setAttribute('aria-expanded', String(!collapsed))
})
handle.addEventListener('pointerdown', function(e){
  e.preventDefault()
  dragging = true
  handle.classList.add('dragging')
  document.body.style.userSelect = 'none'
  document.addEventListener('pointermove', onMove)
  document.addEventListener('pointerup', onUp)
})
function onMove(e){
  if (!dragging) return
  var h = Math.max(120, Math.min(500, window.innerHeight - e.clientY))
  footer.style.height = h + 'px'
  footer.classList.remove('collapsed')
  toggle.textContent = '▼'
  toggle.setAttribute('aria-expanded', 'true')
}
function onUp(){
  dragging = false
  handle.classList.remove('dragging')
  document.body.style.userSelect = ''
  document.removeEventListener('pointermove', onMove)
  document.removeEventListener('pointerup', onUp)
}

var MONO_COLORS = [['rgba(94,234,212,.14)','#5eead4'],['rgba(167,139,250,.14)','#a78bfa'],['rgba(129,140,248,.14)','#a5b4fc'],['rgba(52,211,153,.14)','#34d399'],['rgba(251,191,36,.14)','#fbbf24']]

function providerCard(p){
  var disp = MOCK.providerNames[p.name] || p.name

    chip = '<span class="health-chip off">' + t('providersPage.unconfigured') + '</span>'

    chip = '<span class="health-chip ok">' + t('providersPage.healthy.ok') + '</span>'

function provTest(name){
  var p = getProvider(name)
  if (!p) return
  var btn = document.querySelector('[data-action="prov-test"][data-provider="' + name + '"]')
  if (btn){ btn.disabled = true; btn.textContent = t('providersPage.testing') }
  var disp = MOCK.providerNames[name] || name
  mockDelay(900, function(){
    if (btn){ btn.disabled = false; btn.textContent = t('providersPage.test') }
    if (!p.configured || p.healthy === false){
      toast(t('providersPage.testFail', {name: disp}), 'error')
      logAppend('健康检测失败：' + disp, 'error')
    } else {
      p.healthy = true
      p.latency_ms = 80 + Math.floor(Math.random() * 480)
      var ok = p.latency_ms <= 400
      toast(t('providersPage.testOk', {name: disp, ms: p.latency_ms, status: ok ? t('providersPage.healthy.ok') : t('providersPage.healthy.slow')}))

    }
    renderProviders()
    schedulePersist()
  })
}

function renderChat(){
  var box = document.getElementById('pg-messages')
  if (!box) return
  if (!state.playground.messages.length){
    box.innerHTML = '<div class="chat-empty">' + t('modelSettings.chatEmpty') + '</div>'
    return
  }
  box.innerHTML = state.playground.messages.map(function(m){
    if (m.role === 'fail'){
      return '<div class="chat-row bot"><span class="chat-role">AI</span><div class="error-banner" style="margin-bottom:0;max-width:72%"><span class="err-icon" aria-hidden="true">⚠</span><span class="err-msg">' + esc(m.text) + ' <button class="btn-secondary" data-action="pg-retry">' + t('actionBtn.retry') + '</button></span></div></div>'

    return '<div class="chat-row ' + cls + '"><span class="chat-role">' + (m.role === 'user' ? '我' : 'AI') + '</span><div class="chat-bubble' + (m.role === 'thinking' ? ' thinking' : '') + '">' + esc(m.text) + '</div></div>'

  renderChat()
  refreshModelSettings()   /* 首次渲染：填充 ms-model 选项与连接表单值 */
  dirtyFlags['model-settings'] = false
  refreshSnapshot()

function refreshModelSettings(){
  var p = getProvider(state.currentProvider)
  if (!p) return
  var first = !_msRendered
  var changed = _msLastProvider !== state.currentProvider
  if (!first && !changed) return
  _msLastProvider = state.currentProvider
  _msRendered = true
  if (changed && !first){
    state.msForm.model = p.model
    state.msForm.apiKey = 'sk-demo-' + state.currentProvider
    state.msForm.baseUrl = MOCK.baseUrls[state.currentProvider] || ''
  }
  var selP = document.getElementById('ms-provider')
  var selM = document.getElementById('ms-model')
  var key = document.getElementById('ms-apikey')
  var base = document.getElementById('ms-baseurl')
  if (selP) selP.value = state.currentProvider
  if (selM){
    var models = getProviderModels(state.currentProvider)
    if (models.indexOf(state.msForm.model) === -1) state.msForm.model = models[0] || ''
    selM.innerHTML = models.map(function(m){
      return '<option value="' + esc(m) + '"' + (m === state.msForm.model ? ' selected' : '') + '>' + esc(m) + '</option>'
    }).join('')
  }
  if (key) key.value = state.msForm.apiKey
  if (base) base.value = state.msForm.baseUrl
  if (!first) refreshSnapshot()   /* 联动后快照同步（不视为用户编辑） */
}
function onProviderSelect(){
  var sel = document.getElementById('ms-provider')
  if (!sel || sel.value === state.currentProvider) return
  state.currentProvider = sel.value
  schedulePersist()
  refreshModelSettings()
  markDirty('model-settings')
}
function testConnection(){
  var btn = document.getElementById('ms-test')
  var banner = document.getElementById('ms-error')
  if (!btn) return
  btn.disabled = true
  btn.textContent = t('modelSettings.testing')
  if (banner) banner.hidden = true
  var p = getProvider(state.currentProvider)
  var disp = MOCK.providerNames[state.currentProvider] || state.currentProvider
  var fail = p.healthy === false || (p.healthy === null && Math.random() < 0.5)   /* healthy=false 必失败；null 随机 */
  mockDelay(800, function(){
    btn.disabled = false
    btn.textContent = t('modelSettings.testConnection')
    if (fail){
      banner.hidden = false
      banner.querySelector('.err-msg').innerHTML = esc(t('modelSettings.connectionFail', {name: disp})) + ' <button class="btn-secondary" data-action="ms-test">' + t('actionBtn.retry') + '</button>'
      toast(t('toast.connectionFail'), 'error')
      logAppend('连接测试失败：' + disp, 'error')
    } else {
      var ms = 120 + Math.floor(Math.random() * 480)
      toast(t('toast.connectionOk', {ms: ms}))
      logAppend('连接测试成功：' + disp + ' · ' + ms + 'ms', 'info')
    }
  })
}
function toggleApiKey(){
  var key = document.getElementById('ms-apikey')

  if (!key || !btn) return
  var show = key.type === 'password'
  key.type = show ? 'text' : 'password'
  btn.textContent = show ? t('modelSettings.hideKey') : t('modelSettings.showKey')
  btn.setAttribute('aria-label', show ? t('modelSettings.hideKey') : t('modelSettings.showKey'))

function failSimOn(){ var el = document.getElementById('pg-fail-sim'); return !!(el && el.checked) }
function pgFinishSim(text, retry){
  var arr = state.playground.messages
  for (var i = arr.length - 1; i >= 0; i--){ if (arr[i].role === 'thinking'){ arr.splice(i, 1); break } }
  if (failSimOn()){
    arr.push({role: 'fail', text: t('modelSettings.failSimMsg', {provider: MOCK.providerNames[state.currentProvider] || state.currentProvider})})
    toast(t('toast.requestFail'), 'error')
    logAppend('Playground 请求失败（模拟失败开关）：' + text.slice(0, 30), 'error')
  } else {
    var p = state.params
    arr.push({role: 'bot', text: t('modelSettings.demoReply', {

    })})

  input.value = ''
  state.playground.messages.push({role: 'user', text: text})

function pgRetry(){
  var arr = state.playground.messages
  var lastUser = null
  for (var i = arr.length - 1; i >= 0; i--){ if (arr[i].role === 'user'){ lastUser = arr[i].text; break } }

  renderChat()
  schedulePersist()
  mockDelay(1200 + Math.random() * 800, function(){ pgFinishSim(lastUser, true) })

  chk('presence_penalty', cfg.presence_penalty, -2, 2, 'presence_penalty ±2')

  chk('channel_context_settings.char_limit', cfg.channel_context_settings.char_limit, 1, 20000, '频道字符上限 1-20000')
  chk('memory_context_settings.message_limit', cfg.memory_context_settings.message_limit, 1, 100, '记忆消息上限 1-100')
  chk('memory_context_settings.char_limit', cfg.memory_context_settings.char_limit, 1, 20000, '记忆字符上限 1-20000')
  chk('auto_interject_interval', cfg.auto_interject_interval, 1, 99999, '插话间隔 ≥1')

function mergeConfig(base, src){
  var out = clone(base)
  var keys = ['bot_name','platform','enabled','trigger_keywords','trigger_match_mode','trigger_case_sensitive','temperature','top_p','max_tokens','top_k','frequency_penalty','presence_penalty',
    'context_mode','channel_context_settings','memory_context_settings','auto_interject_enabled','auto_interject_interval','repeat_parrot_enabled',
    'repeat_parrot_threshold','auto_memory_enabled','auto_memory_recall_top_k','auto_memory_recall_char_limit','auto_memory_recall_max_age_days','system_prompt','api_secret_key','discord_token','llm_provider','api_key','model_name','base_url']
  keys.forEach(function(k){
    if (src[k] === undefined) return
    if (k === 'channel_context_settings' || k === 'memory_context_settings'){
      out[k] = clone(out[k])
      if (src[k] && typeof src[k] === 'object'){
        if (isNum(src[k].message_limit, 1, 100)) out[k].message_limit = src[k].message_limit
        if (isNum(src[k].char_limit, 1, 20000)) out[k].char_limit = src[k].char_limit
      }
    } else if (k === 'trigger_keywords'){
      out[k] = Array.isArray(src[k]) ? src[k].map(String).slice(0, 50) : out[k]
    } else {
      out[k] = src[k]
    }
  })
  return out
}
function importConfig(file){
  var reader = new FileReader()
  reader.onload = function(){
    var banner = document.getElementById('cfg-error')
    try {
      var obj = JSON.parse(reader.result)
      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('bad json')
      var merged = mergeConfig(getBotConfig(state.currentBotId), obj)
      var errs = validateConfig(merged)
      if (errs.length) throw new Error('invalid: ' + errs.map(function(e){ return e.label }).join(','))
      state.configs[state.currentBotId] = merged
      renderConfigForm()
      schedulePersist()
      toast(t('toast.importOk', {name: state.currentBotId}))
      logAppend('导入配置成功：' + state.currentBotId, 'info')
    } catch(err){
      if (banner){ banner.hidden = false; banner.querySelector('.err-msg').innerHTML = esc(t('configPanel.importFail')) }
      toast(t('toast.importFail'), 'error')

    state.templates = clone(state.presets[name])
  } else {
    toast(t('promptStudio.presetMissing'), 'error')
    return
  }
  psPresetName = name

function psPresetDel(){

function renderPsList(){

  editor.selectionStart = editor.selectionEnd = start + ph.length

function psBuild(){

function renderDbgChatMsgs(){
  var box = document.getElementById('dbg-chat')
  var msgs = state.debugChat
  if (!msgs.length){ box.innerHTML = '<div class="chat-empty">' + t('debugger.chatEmpty') + '</div>'; return }
  box.innerHTML = msgs.map(function(m){
    if (m.role === 'reasoning'){
      return '<details class="reasoning-bubble"' + (m.open ? ' open' : '') + '><summary>' + t('debugger.reasoning') + '</summary><div class="reasoning-content">' + esc(m.text) + '</div></details>'
    }
    var cls = m.role === 'user' ? 'user' : 'bot'
    return '<div class="chat-row ' + cls + '"><span class="chat-role">' + (m.role === 'user' ? '我' : 'AI') + '</span><div class="chat-bubble' + (m.role === 'thinking' ? ' thinking' : '') + '">' + esc(m.text) + '</div></div>'
  }).join('')

function dbgSend(){
  var input = document.getElementById('dbg-input')
  var text = input.value.trim()

  input.value = ''
  dbgThinking = true
  state.debugChat.push({role: 'user', text: text})
  state.debugChat.push({role: 'reasoning', text: '（模拟思维链）用户说「' + text + '」。\n1. 解析意图：' + text.slice(0, 12) + '…\n2. 检索知识库：无强相关条目\n3. 拟定回复：简洁直接，符合人设。', open: false})

  mockDelay(1200 + Math.random() * 800, function(){
    dbgThinking = false

    for (var i = arr.length - 1; i >= 0; i--){ if (arr[i].role === 'thinking'){ arr.splice(i, 1); break } }

function renderCapDetailInner(cap){
  var d = cap.detail
  var steps = d.intermediate_llm_responses || []
  var nodes = [{stage: 'request', name: cap.provider + ' · ' + cap.model, t: 0}]
  var acc = 0
  var costs = {reasoning: 120, tool_call: 120, tool_result: 340, response: 610}
  steps.forEach(function(s){
    acc += costs[s.stage] || 180
    nodes.push({stage: s.stage, name: s.name || '', args: s.args || '', content: s.content || '', t: acc})
  })
  var tl = nodes.map(function(n){
    var dot = n.stage === 'tool_call' ? 'warn' : 'ok'
    var body = n.stage === 'tool_call'
      ? '<div class="tl-head">' + traceStageLabel(n.stage) + ' · ' + esc(n.name) + '</div><div class="tl-meta">' + esc(n.args) + '</div>'
      : n.content
        ? '<div class="tl-head">' + traceStageLabel(n.stage) + '</div><div class="tl-meta">' + esc(n.content) + '</div>'
        : '<div class="tl-head">' + traceStageLabel(n.stage) + (n.name ? ' · ' + esc(n.name) : '') + '</div>'
    return '<div class="tl-node"><span class="tl-dot ' + dot + '"></span><div class="tl-body">' + body + '<div class="tl-time">+' + n.t + 'ms</div></div></div>'
  }).join('')
  var usage = d.usage || {}
  return '<div class="field-label" style="margin-bottom:8px">' + t('debugger.trace') + '</div>' + '<div class="timeline">' + tl + '</div>' + '<div class="usage-row"><span>' + t('debugger.usage', {p: usage.prompt_tokens, c: usage.completion_tokens, t: usage.total_tokens}) + '</span></div>' + '<details class="detail-fold"><summary>' + t('debugger.detailSys') + '</summary><div class="fold-body"><div class="sim-pane" style="max-height:140px">' + esc(d.system_prompt) + '</div></div></details>' + '<details class="detail-fold"><summary>' + t('debugger.detailHistory') + '</summary><div class="fold-body">' + (d.history_for_llm || []).map(function(h){
      return '<div class="chat-row ' + (h.role === 'user' ? 'user' : 'bot') + '"><span class="chat-role">' + (h.role === 'user' ? '我' : 'AI') + '</span><div class="chat-bubble">' + esc(h.content) + '</div></div>'
    }).join('') + '</div></details>' + '<details class="detail-fold"><summary>' + t('debugger.detailRaw') + '</summary><div class="fold-body"><pre class="json-pre">' + esc(JSON.stringify(d, null, 2)) + '</pre></div></details>'
}

var viewRefreshHooks = {'model-settings': refreshModelSettings, config: refreshConfig, appearance: renderApFxState}   /* appearance 激活时同步顶栏 fx/动画开关状态 */

/* ============ 6. 入口 —— hash 初始化 / 导航 / 事件委托 / splash / 初始化日志 ============ */
var VIEWS = {providers:1, 'model-settings':1, config:1, 'prompt-studio':1, debugger:1, 'user-options':1, appearance:1}
var DEFAULT_VIEW = 'config'   /* 设计 §1.2：缺省视图 = config（控制面板），S1b 起生效 */
var renderedViews = {}
function showView(id){
  if (!VIEWS[id]) return
  if (hasDirtyForm(getActiveView())){   /* 脏表单确认（§1.2）：确认 → 丢弃本地编辑并继续；取消 → 中止切换（点击驱动时 hash 尚未变化，无回滚问题） */
    confirmDialog(t('dialog.dirtyConfirm'), function(ok){
      if (!ok) return
      discardDirtyEdits()
      doShowView(id)
    })
    return
  }
  doShowView(id)
}
function doShowView(id){
  document.querySelectorAll('.view').forEach(function(v){ v.hidden = v.dataset.view !== id })
  document.querySelectorAll('.nav-item').forEach(function(n){
    var on = n.dataset.view === id
    n.classList.toggle('active', on)
    if (on) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current')
  })
  if (!renderedViews[id]){ if (viewRenderers[id]) viewRenderers[id](); renderedViews[id] = true }
  if (viewRefreshHooks[id]) viewRefreshHooks[id]()   /* 视图激活刷新钩子（幂等，§1.2） */
  if (location.hash.slice(1) !== id) location.hash = id
}
window.addEventListener('hashchange', function(){
  var v = location.hash.slice(1)
  if (VIEWS[v]) showView(v)
})
var initView = location.hash.slice(1)
if (!VIEWS[initView]) initView = DEFAULT_VIEW
showView(initView)

function trapTab(scope, e){
  if (scope.hidden || !scope.contains(e.target)) return false
  var f = getFocusables(scope)
  if (!f.length) return false
  if (e.shiftKey && e.target === f[0]){ e.preventDefault(); f[f.length - 1].focus(); return true }
  if (!e.shiftKey && e.target === f[f.length - 1]){ e.preventDefault(); f[0].focus(); return true }
  return false
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (!fxWrap.hidden){ fxWrap.hidden = true; fxBtn.setAttribute('aria-expanded', 'false'); fxBtn.focus() }
    else if (!langMenu.hidden){ langMenu.hidden = true; langBtn.setAttribute('aria-expanded', 'false'); langBtn.focus() }
    else if (!document.getElementById('modal').hidden) closeModal()
    return
  }
  if (e.key === 'Tab'){   /* 焦点圈闭（§9）：modal / fx-wrap / lang-menu */
    if (trapTab(document.getElementById('modal'), e)) return
    if (trapTab(fxWrap, e)) return
    trapTab(langMenu, e)
  }
})
